
<form [formGroup]="vehicleForm" (ngSubmit)="onSubmit()">

  <!-- ID Field -->

    <!--- Id Field -->
    <div class="form-group">
    <label for="id">ID</label>
    <input type="number" id="id" formControlName="id" pattern="^[0-9]*$
" />
  </div>

  <!-- Type Field -->
  <div class="form-group">
    <label for="type">Type</label>
    <input type="text" id="type" formControlName="type" />
  </div>

  <!-- Model Field -->
  <div class="form-group">
    <label for="model">Model</label>
    <input type="text" id="model" formControlName="model" />
  </div>

  <!-- Year Field -->
  <div class="form-group">
    <label for="year">Year</label>
    <input type="number" id="department" formControlName="year" />
  </div>

    <!-- Km Field -->
    <div class="form-group">
      <label for="km">Km</label>
      <input type="number" id="department" formControlName="km" />
    </div>

  <!-- isSold Checkbox -->
  <div class="form-group">
    <label for="isSold">Is Sold</label>
    <input type="checkbox" id="isSold" formControlName="isSold" />
  </div>

  <!-- Submit Button (Add or Update) -->
  <button type="submit">Submit</button>

  <!-- Delete Button (Always Displayed Now) -->
  <button type="button" (click)="onDelete()">Delete</button>

  <!-- Back Button -->
  <button type="button" (click)="navigateToVehicleList()">Back to List</button>
</form>
<div *ngIf="error" class="error">{{ error }}</div>
